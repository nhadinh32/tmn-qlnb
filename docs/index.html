    <style>
      #boot {
        position: fixed;

      #boot svg {

      #boot .boot-track {
        position: relative;
        width: 200px;
        height: 4px;

        border-radius: 9999px;

      }
      #boot .boot-bar {
        position: absolute;
        top: 0;

        left: 0;
        width: 35%;
        border-radius: 9999px;
        background: #1d4ed8;
        animation: boot-slide 1.2s ease-in-out infinite alternate;
      }
      @keyframes boot-slide {
        to {
          left: 65%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar {
          width: 100%;
          opacity: 0.5;
          animation: none;
        }
      }
